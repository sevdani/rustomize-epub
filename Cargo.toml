[package]
name = "rustomize-epub"
version = "1.0.5"
edition = "2021"
description = "High-performance EPUB optimizer for e-ink devices"
readme = "README.md"
license = "MIT"
repository = "https://github.com/your-username/rustomize-epub"

[lib]
name = "rustomize_epub"
path = "src/lib.rs"

[[bin]]
name = "rustomize-epub"
path = "src/bin/rustomize-epub.rs"
doc = false

[dependencies]
# Core dependencies
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "color_quant"] }
zip = { version = "9.7.0", default-features = false, features = ["deflate"] }
unicode-normalization = "0.1.26"
thiserror = "2.0.21"
clap = { version = "4.6.8", features = ["derive"] }
rayon = { version = "1.12.0", optional = true }

# Font rendering for cover generation (pure Rust, no system deps)
rusttype = "0.9.3"

# HTML parsing with regex (simpler approach for attribute stripping)
regex = "1.13.2"

[features]
default = []
parallel = ["rayon"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.bench]
inherits = "release"
